<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

.pr-root {
  --paper: #EEF0EA; --paper-2: #F8F9F5; --ink: #1B2430; --ink-soft: #5B6472;
  --amber: #C1852E; --amber-soft: #EFDCB8; --teal: #2F7A63; --teal-soft: #DCEAE3;
  --clay: #A85039; --clay-soft: #F0DAD3; --slate: #8A8F98; --slate-soft: #E7E7E4;
  --line: #D7D9D0; --card: #FFFFFF;
  font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--paper);
  padding: 24px; border-radius: 14px; box-sizing: border-box;
}
.pr-root * { box-sizing: border-box; }

.pr-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin: 0 0 6px 0; }
.pr-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 4px 0; }
.pr-sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px 0; }

.pr-flowstrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 8px; }
.pr-flowstep {
  flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 7px 11px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--card); cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); white-space: nowrap;
  transition: all .12s;
}
.pr-flowstep:hover { border-color: var(--amber); }
.pr-flowstep.active { background: var(--ink); color: var(--paper-2); border-color: var(--ink); }
.pr-flowstep .n { font-weight: 700; color: var(--amber); }
.pr-flowstep.active .n { color: var(--amber); }

.pr-frame {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(27,36,48,0.06);
}
.pr-framebar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--paper-2); }
.pr-framebar .d { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.pr-framebar .label { margin-left: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

.pr-screen { padding: 34px 30px; min-height: 460px; }
.pr-nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--paper-2); }
.pr-navbtn {
  font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12.5px; border: none;
  padding: 8px 16px; border-radius: 7px; cursor: pointer;
}
.pr-navbtn.next { background: var(--ink); color: var(--paper-2); }
.pr-navbtn.next:hover { background: #2b3547; }
.pr-navbtn.back { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
.pr-navbtn.back:hover { color: var(--ink); border-color: var(--ink-soft); }
.pr-navbtn:disabled { opacity: .35; cursor: not-allowed; }

/* Reusable pieces */
.pr-h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; margin: 0 0 10px 0; line-height: 1.15; }
.pr-h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 6px 0; }
.pr-p { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin: 0 0 20px 0; max-width: 460px; }
.pr-cta { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; background: var(--amber); color: #fff; border: none; padding: 12px 22px; border-radius: 8px; cursor: pointer; }
.pr-cta:hover { background: #a86f24; }
.pr-cta-outline { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 18px; border-radius: 8px; cursor: pointer; margin-left: 10px; }

.pr-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
.pr-badge.have { background: var(--teal-soft); color: var(--teal); }
.pr-badge.partial { background: var(--amber-soft); color: var(--amber); }
.pr-badge.missing { background: var(--clay-soft); color: var(--clay); }

.pr-rolegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 460px; margin-bottom: 22px; }
.pr-rolecard { border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; transition: all .12s; }
.pr-rolecard:hover { border-color: var(--amber); }
.pr-rolecard.sel { border-color: var(--amber); background: var(--amber-soft); }
.pr-rolecard .ic { font-size: 18px; margin-bottom: 6px; }
.pr-rolecard .t { font-weight: 600; font-size: 13.5px; }

.pr-dropzone { border: 1.5px dashed var(--line); border-radius: 12px; padding: 34px; text-align: center; max-width: 420px; margin-bottom: 18px; }
.pr-dropzone .ic { font-size: 22px; color: var(--amber); margin-bottom: 8px; }
.pr-dropzone .t { font-weight: 600; font-size: 13.5px; margin-bottom: 3px; }
.pr-dropzone .s { font-size: 12px; color: var(--ink-soft); }

.pr-checklist { display: flex; flex-direction: column; gap: 12px; max-width: 380px; }
.pr-checkitem { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.pr-checkitem .c { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--teal); display: flex; align-items: center; justify-content: center; color: var(--teal); font-size: 11px; flex-shrink: 0; }
.pr-checkitem.pending .c { border-color: var(--line); }

.pr-skillgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 18px; }
.pr-skillcard { border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; }
.pr-skillcard .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; align-items: center; }
.pr-skillcard .n { font-weight: 600; font-size: 12.5px; }

.pr-trailmini { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
.pr-wk { flex: 0 0 auto; width: 128px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
.pr-wk.cur { border-color: var(--amber); background: var(--amber-soft); }
.pr-wk .num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--amber); font-weight: 700; }
.pr-wk .th { font-size: 12px; font-weight: 600; margin-top: 3px; line-height: 1.3; }

.pr-task { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); max-width: 420px; }
.pr-task:first-child { border-top: none; }
.pr-cb { width: 17px; height: 17px; border: 1.5px solid var(--ink-soft); border-radius: 4px; flex-shrink: 0; margin-top: 2px; }
.pr-cb.on { background: var(--teal); border-color: var(--teal); position: relative; }
.pr-cb.on::after { content: '✓'; position: absolute; inset: 0; color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
.pr-tasktext { font-size: 13.5px; line-height: 1.4; }

.pr-statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 460px; margin-bottom: 22px; }
.pr-stat { border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
.pr-stat .v { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: var(--amber); }
.pr-stat .l { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }

.pr-ring { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(var(--amber) 0% 42%, var(--slate-soft) 42% 100%); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.pr-ring .inner { width: 68px; height: 68px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }

.pr-chat { max-width: 440px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.pr-bubble { padding: 10px 13px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 85%; }
.pr-bubble.user { background: var(--ink); color: var(--paper-2); align-self: flex-end; border-radius: 12px 12px 3px 12px; }
.pr-bubble.bot { background: var(--paper-2); border: 1px solid var(--line); align-self: flex-start; border-radius: 12px 12px 12px 3px; }
.pr-chatinput { display: flex; gap: 8px; max-width: 440px; }
.pr-chatinput input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.pr-chatinput button { background: var(--ink); color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 12px; cursor: pointer; }

.pr-plans { display: flex; gap: 14px; max-width: 480px; }
.pr-plan { flex: 1; border: 1.5px solid var(--line); border-radius: 12px; padding: 18px; }
.pr-plan.pro { border-color: var(--amber); background: var(--amber-soft); }
.pr-plan .tier { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; color: var(--ink-soft); }
.pr-plan .price { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin: 4px 0 10px 0; }
.pr-plan ul { margin: 0; padding: 0 0 0 4px; list-style: none; font-size: 12.5px; color: var(--ink-soft); }
.pr-plan li { padding: 4px 0; }
.pr-plan li::before { content: '— '; color: var(--amber); }
</style>

<div class="pr-root">
  <p class="pr-eyebrow">AI Career Copilot — Click-through Prototype</p>
  <h1 class="pr-title">10-screen user journey</h1>
  <p class="pr-sub">Landing → signup intent → resume upload → analysis → gap dashboard → roadmap → weekly tasks → progress → AI assistant → upgrade. Click a step below, or use Next/Back inside the frame.</p>

  <div class="pr-flowstrip" id="pr-flowstrip"></div>

  <div class="pr-frame">
    <div class="pr-framebar">
      <div class="d"></div><div class="d"></div><div class="d"></div>
      <span class="label" id="pr-framelabel"></span>
    </div>
    <div class="pr-screen" id="pr-screen"></div>
    <div class="pr-nav">
      <button class="pr-navbtn back" id="pr-back">← Back</button>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);" id="pr-pos"></span>
      <button class="pr-navbtn next" id="pr-next">Next →</button>
    </div>
  </div>
</div>

<script>
(function() {
  const SCREENS = [
    { id: 'landing', label: 'Landing Page' },
    { id: 'career', label: 'Career Selection' },
    { id: 'upload', label: 'Resume Upload' },
    { id: 'analysis', label: 'Skill Analysis' },
    { id: 'gap', label: 'Skill-Gap Dashboard' },
    { id: 'roadmap', label: 'Recommended Roadmap' },
    { id: 'tasks', label: 'Weekly Tasks' },
    { id: 'progress', label: 'Progress Dashboard' },
    { id: 'assistant', label: 'AI Assistant' },
    { id: 'upgrade', label: 'Upgrade / Payment' },
  ];

  let current = 0;
  const state = { role: 'Product Manager', tasksChecked: [true, false, false] };

  const screenEl = document.getElementById('pr-screen');
  const flowstrip = document.getElementById('pr-flowstrip');
  const frameLabel = document.getElementById('pr-framelabel');
  const posEl = document.getElementById('pr-pos');
  const backBtn = document.getElementById('pr-back');
  const nextBtn = document.getElementById('pr-next');

  function buildFlowstrip() {
    flowstrip.innerHTML = SCREENS.map((s, i) =>
      `<div class="pr-flowstep ${i === current ? 'active' : ''}" data-goto="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span>${s.label}</div>`
    ).join('');
    flowstrip.querySelectorAll('[data-goto]').forEach(el => {
      el.addEventListener('click', () => goTo(parseInt(el.getAttribute('data-goto'))));
    });
  }

  const renderers = {
    landing: () => `
      <p style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;">AI Career Copilot</p>
      <h1 class="pr-h1">Stop guessing<br/>what to learn next.</h1>
      <p class="pr-p">Upload your resume, tell us the role you want, and get a personalized skill-gap analysis plus a 12-week roadmap — built for you, not a generic playlist.</p>
      <button class="pr-cta" data-next>Get my roadmap →</button>
      <button class="pr-cta-outline" data-next>See how it works</button>
      <div class="pr-statgrid" style="margin-top:34px;">
        <div class="pr-stat"><div class="v">12wk</div><div class="l">Avg. plan length</div></div>
        <div class="pr-stat"><div class="v">4</div><div class="l">Roles supported</div></div>
        <div class="pr-stat"><div class="v">Free</div><div class="l">To start</div></div>
      </div>`,

    career: () => `
      <h2 class="pr-h2">What role are you aiming for?</h2>
      <p class="pr-p">This decides the skill taxonomy we compare your resume against.</p>
      <div class="pr-rolegrid" id="pr-rolegrid">
        ${['Product Manager','Software Engineer','Data Analyst','Marketing'].map(r => `
          <div class="pr-rolecard ${r === state.role ? 'sel' : ''}" data-role="${r}">
            <div class="ic">${r === 'Product Manager' ? '◇' : r === 'Software Engineer' ? '◆' : r === 'Data Analyst' ? '▣' : '◈'}</div>
            <div class="t">${r}</div>
          </div>`).join('')}
      </div>
      <button class="pr-cta" data-next>Continue →</button>`,

    upload: () => `
      <h2 class="pr-h2">Add your resume</h2>
      <p class="pr-p">PDF, DOCX, or just paste the text — the parser handles messy formatting.</p>
      <div class="pr-dropzone">
        <div class="ic">⇧</div>
        <div class="t">Drop your resume here</div>
        <div class="s">or click to browse · PDF, DOCX, TXT</div>
      </div>
      <button class="pr-cta" data-next>Analyze my resume →</button>`,

    analysis: () => `
      <h2 class="pr-h2">Reading your resume…</h2>
      <p class="pr-p">This usually takes under 15 seconds.</p>
      <div class="pr-checklist">
        <div class="pr-checkitem"><div class="c">✓</div>Extracting skills, projects & experience</div>
        <div class="pr-checkitem"><div class="c">✓</div>Classifying against ${state.role} taxonomy</div>
        <div class="pr-checkitem pending"><div class="c"></div>Building your 12-week roadmap</div>
      </div>
      <button class="pr-cta" style="margin-top:26px;" data-next>View my results →</button>`,

    gap: () => `
      <h2 class="pr-h2">Your skill gap</h2>
      <p class="pr-p">4 have · 4 partial · 4 missing, out of 12 core ${state.role} skills.</p>
      <div class="pr-skillgrid">
        ${[['User research','have'],['Writing PRDs','partial'],['Prioritization (RICE)','have'],['Roadmapping','partial'],['Product metrics','missing'],['A/B testing','missing'],['Wireframing / UX','partial'],['Stakeholder comms','have'],['Market analysis','partial'],['Technical fluency','have'],['Strategic thinking','partial'],['Data-informed decisions','missing']]
          .map(([n,s]) => `<div class="pr-skillcard"><div class="top"><span class="n">${n}</span><span class="pr-badge ${s}">${s}</span></div></div>`).join('')}
      </div>
      <button class="pr-cta" data-next>Build my roadmap →</button>`,

    roadmap: () => `
      <h2 class="pr-h2">Your 12-week route</h2>
      <p class="pr-p">Sequenced so your missing skills come first.</p>
      <div class="pr-trailmini">
        ${['Prioritization basics','Writing your first PRD','Product metrics 101','A/B testing fundamentals','Roadmapping practice','Stakeholder simulation','Mock case study 1','Portfolio project start','Data storytelling','Mock case study 2','Interview prep','Final polish + apply']
          .map((t,i) => `<div class="pr-wk ${i===0?'cur':''}"><div class="num">WK ${String(i+1).padStart(2,'0')}</div><div class="th">${t}</div></div>`).join('')}
      </div>
      <button class="pr-cta" data-next>Start Week 1 →</button>`,

    tasks: () => `
      <h2 class="pr-h2">Week 1 — Prioritization basics</h2>
      <p class="pr-p">3 tasks this week. Check them off as you go.</p>
      <div style="max-width:420px;">
        ${['Read the RICE and MoSCoW sections of "Inspired" (ch. 12)','Score 5 hypothetical features for a sample app using RICE','Write a 1-paragraph justification for your top-ranked feature']
          .map((t,i) => `<div class="pr-task"><div class="pr-cb ${state.tasksChecked[i]?'on':''}" data-taskidx="${i}"></div><div class="pr-tasktext">${t}</div></div>`).join('')}
      </div>
      <button class="pr-cta" style="margin-top:20px;" data-next>Go to my progress →</button>`,

    progress: () => `
      <h2 class="pr-h2">Your progress</h2>
      <div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap;">
        <div class="pr-ring"><div class="inner">42%</div></div>
        <div class="pr-statgrid" style="margin-bottom:0;">
          <div class="pr-stat"><div class="v">15</div><div class="l">Tasks done</div></div>
          <div class="pr-stat"><div class="v">3</div><div class="l">Week streak</div></div>
          <div class="pr-stat"><div class="v">Wk 5</div><div class="l">Currently on</div></div>
        </div>
      </div>
      <button class="pr-cta" style="margin-top:24px;" data-next>Ask the AI assistant →</button>`,

    assistant: () => `
      <h2 class="pr-h2">Ask your copilot</h2>
      <div class="pr-chat">
        <div class="pr-bubble user">What should I focus on this week?</div>
        <div class="pr-bubble bot">You're in Week 5 — Roadmapping practice. Since your gap analysis flagged "Product metrics" as missing, spend 20 minutes today reading how retention (D7/D30) is defined before Thursday's roadmapping task — it'll make the exercise land better.</div>
      </div>
      <div class="pr-chatinput"><input placeholder="Ask anything about your roadmap..." disabled /><button data-next>Send</button></div>`,

    upgrade: () => `
      <h2 class="pr-h2">Unlock your full roadmap</h2>
      <p class="pr-p">You've used your free 2-week preview. Go Pro for the full 12 weeks.</p>
      <div class="pr-plans">
        <div class="pr-plan">
          <div class="tier">Free</div>
          <div class="price">$0</div>
          <ul><li>1 skill-gap analysis</li><li>2-week roadmap preview</li><li>No progress tracking</li></ul>
        </div>
        <div class="pr-plan pro">
          <div class="tier">Pro</div>
          <div class="price">$9/mo</div>
          <ul><li>Full 12-week roadmap</li><li>Progress tracking</li><li>Unlimited AI assistant</li></ul>
        </div>
      </div>
      <button class="pr-cta" style="margin-top:22px;" data-next>Upgrade to Pro →</button>`,
  };

  function render() {
    const s = SCREENS[current];
    frameLabel.textContent = `${s.label} — screen ${current + 1} of ${SCREENS.length}`;
    posEl.textContent = `${current + 1} / ${SCREENS.length}`;
    screenEl.innerHTML = renderers[s.id]();
    backBtn.disabled = current === 0;
    nextBtn.textContent = current === SCREENS.length - 1 ? 'Restart ↺' : 'Next →';
    buildFlowstrip();

    screenEl.querySelectorAll('[data-next]').forEach(el => el.addEventListener('click', goNext));
    const roleGrid = document.getElementById('pr-rolegrid');
    if (roleGrid) {
      roleGrid.querySelectorAll('[data-role]').forEach(el => {
        el.addEventListener('click', () => { state.role = el.getAttribute('data-role'); render(); });
      });
    }
    screenEl.querySelectorAll('[data-taskidx]').forEach(el => {
      el.addEventListener('click', () => {
        const i = parseInt(el.getAttribute('data-taskidx'));
        state.tasksChecked[i] = !state.tasksChecked[i];
        render();
      });
    });
  }

  function goTo(i) { current = Math.max(0, Math.min(SCREENS.length - 1, i)); render(); }
  function goNext() { current = current === SCREENS.length - 1 ? 0 : current + 1; render(); }
  function goBack() { if (current > 0) { current -= 1; render(); } }

  document.getElementById('pr-next').addEventListener('click', goNext);
  document.getElementById('pr-back').addEventListener('click', goBack);

  render();
})();
</script>
